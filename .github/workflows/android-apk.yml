name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi
          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"

      - name: Extract Android project ZIP
        run: |
          if [ ! -f "BHABISHYAT-SANCHAY-GitHub-Actions.zip" ]; then
            echo "Project ZIP not found!"
            exit 1
          fi
          mkdir -p /tmp/bhabishyat-project
          unzip -q BHABISHYAT-SANCHAY-GitHub-Actions.zip -d /tmp/bhabishyat-project
          find /tmp/bhabishyat-project -mindepth 1 -maxdepth 1 ! -name '.github' -exec cp -a {} . \;
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          echo "Android project extracted successfully"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate debug signing keys
        run: |
          keytool -genkeypair -noprompt -keystore debug.keystore -storepass android -alias android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          keytool -genkeypair -noprompt -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          keytool -list -keystore debug.keystore -storepass android

      - name: Build Android APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BHABISHYAT-SANCHAY-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
